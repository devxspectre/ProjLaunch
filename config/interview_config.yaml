questions:
  - id: team_size
    ask: "How many people are on your engineering team?"
    implications:
      1-3: "Small team — single WIP limit of 1, minimal columns (3)"
      4-8: "Medium team — WIP limit of 2, standard 5-column board"
      9+: "Large team — WIP limit of 3, add a triage column"

  - id: methodology
    ask: "Do you work in sprints (Scrum) or continuous flow (Kanban)?"
    implications:
      sprints: "Create milestones per sprint, add Sprint column"
      continuous: "No milestones, add priority labels instead"

  - id: sprint_duration
    ask: "How long are your sprints? (e.g., 1 week, 2 weeks)"
    condition: "only if methodology == sprints"
    implications:
      1: "1-week sprints — tight cycle"
      2: "2-week sprints — standard cadence"
      3+: "3+ week sprints — longer cycle, adjust WIP accordingly"

  - id: work_types
    ask: "What types of work does your team handle? (e.g., bugs, features, tech debt)"
    implications:
      creates: "Labels for each work type mentioned"

  - id: code_review
    ask: "Does your team do code reviews before merging?"
    implications:
      true: "Add a 'Review' column to the board"
      false: "No Review column needed"

  - id: project_name
    ask: "What would you like to name this project board?"
    implications:
      creates: "The project_name argument for create_github_project"
